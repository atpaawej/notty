# Notty factory — Implement (single issue)
#
# Trigger: an issue labelled `agent:implement` (human-applied; the "go" is
# yours, `ready-for-agent` is only triage), or a manual workflow_dispatch
# for the same issue. The run implements the issue on a deterministic
# branch `agent/issue-<N>-<slug>`, pushes it, and opens a **draft** PR with
# `Closes #N`. Nothing merges without a human.
#
# Trust boundaries (from the platform design):
# - The agent never sees the GitHub token. The agent step runs with a
#   scrubbed environment; every GitHub mutation happens in orchestrator
#   steps, before or after the agent runs.
# - `agent:in-progress` is the lock; `agent:blocked` means it needs you.
# - An issue with open blockers (native `blocked_by`) is refused, not
#   attempted.
# - The model is free on this account (OPENCODE_API_KEY authenticates; 0
#   credits, free-tier models only). Free models are limited-time and the
#   pool can exhaust; CI is the leash, no SLA.

name: Agent · Implement

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to implement"
        required: true
        type: number
      model:
        description: "Model to use (default: account-authenticated free tier)"
        required: false
        default: "opencode/deepseek-v4.1-flash-free"
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-implement-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

# gh has no repo context outside a git clone — point it at the repo for
# every step, including preflight (which runs before checkout) and the
# failure reporter (which runs when steps did).
env:
  GH_REPO: ${{ github.repository }}

jobs:
  implement:
    # `issues: labeled` fires for every label. Only `agent:implement` is the
    # trigger; without this, applying `ready-for-agent` or `agent:queued`
    # starts a run immediately.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve issue number and verify it is implementable
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail

          if gh api "repos/${GITHUB_REPOSITORY}/issues/${N}" --jq 'has("pull_request")' | grep -qx true; then
            echo "#$N is a pull request, not an issue — refusing."
            echo "accepted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          ISSUE=$(gh issue view "$N" --json state,labels,title)
          STATE=$(jq -r '.state' <<<"$ISSUE")
          if [ "$STATE" != "OPEN" ]; then
            echo "Issue #$N is $STATE — nothing to do."
            echo "accepted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if jq -e '.labels[].name | select(. == "agent:in-progress")' <<<"$ISSUE" >/dev/null; then
            echo "Issue #$N already has agent:in-progress — another run holds the lock."
            echo "accepted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          BLOCKERS=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${N}/dependencies/blocked_by" \
            --jq '[.[] | select(.state == "open") | .number] | join(", ")')
          if [ -n "$BLOCKERS" ]; then
            gh issue comment "$N" --body "Factory refused: blocked by open issue(s) ${BLOCKERS}. Finish those first, or re-label \`agent:queued\` to auto-promote when the last blocker closes."
            gh issue edit "$N" --remove-label agent:implement --add-label agent:blocked || true
            echo "accepted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          TITLE=$(jq -r '.title' <<<"$ISSUE")
          SLUG=$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-48)
          [ -n "$SLUG" ] || SLUG="issue"
          BRANCH="agent/issue-${N}-${SLUG}"

          gh issue edit "$N" --remove-label agent:implement --remove-label agent:blocked --add-label agent:in-progress || true

          {
            echo "accepted=true"
            echo "branch=$BRANCH"
            echo "title=$TITLE"
          } >>"$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.preflight.outputs.accepted == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Create branch
        if: steps.preflight.outputs.accepted == 'true'
        run: |
          set -euo pipefail
          git config user.name "notty-factory[bot]"
          git config user.email "notty-factory[bot]@users.noreply.github.com"
          git switch -c "${{ steps.preflight.outputs.branch }}"

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.accepted == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        if: steps.preflight.outputs.accepted == 'true'
        run: npm ci

      - name: Install opencode (pinned)
        if: steps.preflight.outputs.accepted == 'true'
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version 2.2.5 --no-modify-path
          # GITHUB_PATH applies to later steps; this step needs it explicitly.
          export PATH="$HOME/.opencode/bin:$PATH"
          opencode --version

      - name: Build the agent prompt from the issue
        if: steps.preflight.outputs.accepted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          {
            printf 'Implement GitHub issue #%s in this repository.\n\n' "$N"
            printf 'Repository conventions are in AGENTS.md. Read it, GLOSSARY.md, and docs/ before changing code.\n\n'
            printf 'The issue to implement:\n\n'
            gh issue view "$N" --json title,body --jq '"## " + .title + "\n\n" + .body'
            printf '\n\nRules:\n'
            printf -- '- You are already on the branch for this work. Do not create or switch branches.\n'
            printf -- '- Do NOT push, do NOT open a PR, do NOT touch GitHub in any way.\n'
            printf -- '- Make the smallest change that satisfies the acceptance criteria.\n'
            printf -- '- Run `npm run typecheck`, `npm test`, `npm run depcruise` and `npm run build`; they must all pass.\n'
            printf -- '- Commit your work in small commits with messages like "Part of #%s: ...".\n' "$N"
            printf -- '- If you are genuinely blocked, stop and leave a note in .factory-blocked.txt explaining why.\n'
            printf '\nBefore you finish, write the pull request description to /tmp/factory-pr-body.md.\n'
            printf 'If your tools cannot write outside the repository, write `.factory-pr-body.md` in the repository root instead.\n'
            printf 'It becomes the body of the draft PR, so write it for a reviewer who has not seen your work.\n\n'
            printf 'Use exactly these headings:\n\n'
            printf '## Summary\n'
            printf 'Two to four sentences: what this change makes possible.\n\n'
            printf '## What changed\n'
            printf 'Grouped by module, with file paths. Not a file dump.\n\n'
            printf '## Decisions and deviations\n'
            printf 'Anything a reviewer cannot infer from the diff, including where you departed from the issue.\n\n'
            printf '## Verification\n'
            printf 'The exact commands you ran and their outcome. Never claim a check you did not run.\n\n'
            printf '## Gaps and follow-ups\n'
            printf 'What you deliberately did not do, and what a reviewer should know.\n\n'
            printf '## Review guide\n'
            printf 'Where to start reading, and what deserves the most scrutiny.\n\n'
            printf 'Rules for that file: no title line; do not write "Closes/Fixes/Resolves #N" (the orchestrator adds the real one and neutralises yours); keep it under 4000 characters; write only what you know.\n'
          } > /tmp/factory-prompt.txt
          wc -c /tmp/factory-prompt.txt

      - name: Run the agent (token-free, account-authenticated)
        if: steps.preflight.outputs.accepted == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/opencode"
          printf '{ "session": { "permissions": "autoaccept" } }\n' > "$HOME/.config/opencode/cli.json"
          # The agent gets a minimal environment: no GITHUB_TOKEN, no GH_TOKEN.
          # OPENCODE_API_KEY authenticates only the free models on this account.
          env -i HOME="$HOME" PATH="$PATH" TERM=dumb CI=true OPENCODE_API_KEY="$OPENCODE_API_KEY" MODEL="${{ inputs.model || 'opencode/deepseek-v4.1-flash-free' }}" bash -lc \
            'cd "$1" && timeout 38m opencode run --model "$MODEL" "$(cat /tmp/factory-prompt.txt)"' \
            _ "$GITHUB_WORKSPACE"

      - name: Commit any uncommitted agent changes
        if: steps.preflight.outputs.accepted == 'true'
        env:
          N: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          # The agent may not be able to write outside the repo. Accept the
          # in-repo location too, and move it out before the catch-all commit so
          # it never lands in the branch.
          if [ -f .factory-pr-body.md ]; then
            mv -f .factory-pr-body.md /tmp/factory-pr-body.md
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Part of #${N}: factory catch-all commit"
          fi

      - name: Ensure the agent produced work
        id: diffcheck
        if: steps.preflight.outputs.accepted == 'true'
        run: |
          set -euo pipefail
          AHEAD=$(git rev-list --count origin/main..HEAD)
          echo "commits ahead of main: $AHEAD"
          if [ "$AHEAD" -eq 0 ]; then
            REASON="(no commits produced by the agent)"
            [ -f .factory-blocked.txt ] && REASON=$(cat .factory-blocked.txt)
            echo "reason=$REASON" >>"$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Push branch
        id: push
        if: steps.preflight.outputs.accepted == 'true' && steps.diffcheck.outcome == 'success'
        env:
          BRANCH: ${{ steps.preflight.outputs.branch }}
        run: |
          set -euo pipefail
          # main can move while the agent runs. Rebase first: without this, a
          # commit to main that touches a workflow file makes this branch look
          # like it modifies that workflow, and GitHub rejects the push without
          # the `workflows` permission.
          git fetch origin main
          git rebase origin/main
          # Deterministic branch; a stale remote branch is a recoverable orphan.
          git push --force origin "HEAD:refs/heads/${BRANCH}"

      - name: Open draft PR
        id: pr
        # The branch is the deliverable. A PR-API failure must not fail the run
        # or mark the issue blocked: the pushed branch is safe and recoverable.
        continue-on-error: true
        if: steps.preflight.outputs.accepted == 'true' && steps.diffcheck.outcome == 'success' && steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number || inputs.issue_number }}
          BRANCH: ${{ steps.preflight.outputs.branch }}
          TITLE: ${{ steps.preflight.outputs.title }}
          MODEL: ${{ inputs.model || 'opencode/deepseek-v4.1-flash-free' }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # The agent writes /tmp/factory-pr-body.md. The script wraps it and owns
          # the parts the agent must not: `Closes #N`, closing keywords in its
          # prose, and the factual sections.
          BODY_SOURCE=$(bash .github/scripts/build-pr-body.sh "$N" "$MODEL" "$RUN_URL")
          BODY=$(cat /tmp/factory-pr-body.out.md)
          echo "body_source=$BODY_SOURCE" >>"$GITHUB_OUTPUT"

          # REST, not `gh pr create`: that command goes through GraphQL, which
          # returned a generic 500 on run 42059874269 while the same request
          # over REST succeeded. Reuse an open PR when one already exists, so a
          # re-run does not depend on creating a second one.
          EXISTING=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f "head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}" \
            --jq '.[0] // empty | "\(.number) \(.html_url)"')

          if [ -n "$EXISTING" ]; then
            NUM=${EXISTING%% *}
            PR_URL=${EXISTING#* }
            # A re-run may have a better description; refresh it. Non-fatal: an
            # existing PR is already the deliverable.
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${NUM}" \
              -f body="$BODY" >/dev/null 2>&1 \
              || echo "::warning::could not refresh the body of PR #${NUM}"
          else
            PR_URL=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
              -f title="$TITLE" \
              -f head="$BRANCH" \
              -f base=main \
              -f body="$BODY" \
              -F draft=true \
              --jq '.html_url')
          fi

          echo "url=$PR_URL" >>"$GITHUB_OUTPUT"

      - name: Report PR outcome
        if: always() && steps.preflight.outputs.accepted == 'true' && steps.diffcheck.outcome == 'success' && steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number || inputs.issue_number }}
          BRANCH: ${{ steps.preflight.outputs.branch }}
          TITLE: ${{ steps.preflight.outputs.title }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          PR_URL: ${{ steps.pr.outputs.url }}
          BODY_SOURCE: ${{ steps.pr.outputs.body_source }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$PR_OUTCOME" = "success" ] && [ -n "$PR_URL" ]; then
            NOTE=""
            if [ "$BODY_SOURCE" = "fallback" ]; then
              NOTE=$'\n\nThe agent left no PR description, so the body was generated from the commits and diffstat.'
            fi
            gh issue comment "$N" --body "Factory run opened draft PR: ${PR_URL}.${NOTE}" || true
            exit 0
          fi

          echo "::warning::Branch ${BRANCH} is pushed, but opening the draft PR failed."
          gh issue comment "$N" --body "$(printf 'Implementation is pushed to `%s`, but GitHub failed to open the draft PR. **The branch is safe — do not re-run the agent.**\n\nOpen it with:\n\n```\ngh pr create --draft --base main --head %s --title "%s"\n```\n\nFailed step log: %s\n' "$BRANCH" "$BRANCH" "$TITLE" "$RUN_URL")" || true

      - name: Report failure
        # A PR-API failure is handled by "Report PR outcome"; it must not add
        # agent:blocked when the branch is already pushed.
        if: failure() && !(steps.push.outcome == 'success' && steps.pr.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number || inputs.issue_number }}
          REASON: ${{ steps.diffcheck.outputs.reason }}
        run: |
          DETAIL=""
          [ -n "$REASON" ] && DETAIL=$(printf '\n\n**Why:** %s' "$REASON")
          gh issue edit "$N" --add-label agent:blocked --remove-label agent:implement || true
          gh issue comment "$N" --body "Factory run failed — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Fix the cause, then re-add \`agent:implement\` to retry.${DETAIL}"

      - name: Clear the in-progress lock
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number || inputs.issue_number }}
        run: gh issue edit "$N" --remove-label agent:in-progress || true
