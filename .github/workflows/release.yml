name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v0.1.0)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri .deb bundle
        run: npm run tauri build -- --bundles deb

      - name: Package standalone tarball
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="${{ inputs.tag_name || github.ref_name }}"
          if [[ -z "$TAG" || "$TAG" == "main" ]]; then
            TAG="v${VERSION}"
          fi
          DIST="notty-${TAG}-linux-x86_64"
          mkdir -p "$DIST"
          cp src-tauri/target/release/notty "$DIST/"
          if [ -d "src-tauri/icons" ]; then
            cp -r src-tauri/icons "$DIST/"
          fi
          tar -czf "${DIST}.tar.gz" "$DIST"
          echo "Created ${DIST}.tar.gz"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            notty-*-linux-x86_64.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
